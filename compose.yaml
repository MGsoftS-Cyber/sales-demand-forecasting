services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: forecast
      POSTGRES_USER: forecast
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - forecast_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forecast -d forecast"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "127.0.0.1:8084:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://forecast:${POSTGRES_PASSWORD}@db:5432/forecast
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8084,http://127.0.0.1:8084}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
volumes:
  forecast_postgres:
